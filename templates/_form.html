{% set sel = (sala_sel or sala_id)|string %}{% set fv = form or {} %}
<form method="post" action="{{ url_for('reservar') }}">{{ csrf_input() }}
<label>Sala</label><select name="sala" id="f-sala">{% for s in salas %}<option value="{{ s.id }}" {{ 'selected' if sel==s.id|string }}>{{ s.nombre }}</option>{% endfor %}</select>
<label>Fecha</label><input type="date" name="fecha" id="f-fecha" min="{{ hoy }}" value="{{ fv.get('fecha','') }}" required>
<div class="row"><div><label>Inicio</label><input type="time" name="hora_inicio" id="f-ini" step="1800" min="07:00" max="20:30" value="{{ fv.get('hora_inicio','') }}" required></div>
<div><label>Fin</label><input type="time" name="hora_fin" id="f-fin" step="1800" min="07:30" max="21:00" value="{{ fv.get('hora_fin','') }}" required></div></div>
<div class="disp" id="disp"></div>
<div class="row"><div><label>Materia</label><input name="materia" maxlength="100" value="{{ fv.get('materia','') }}" required></div><div><label>Alumnos</label><input type="number" name="alumnos" min="1" value="{{ fv.get('alumnos','') }}" required></div></div>
<label>Motivo / práctica</label><textarea name="motivo" rows="3" maxlength="500" required>{{ fv.get('motivo','') }}</textarea><br><button style="width:100%">Enviar solicitud</button></form>
